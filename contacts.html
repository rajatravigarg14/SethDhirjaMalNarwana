<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link rel="canonical" href="https://www.dhirjapariwarnarwana.com/contacts.html">
    <meta name="description"
        content="Contact list for all the family members of Seth Dhirja Mal Pariwar Narwana. If your name is not in the list please contact us by opening this page.">
    
    <!-- Open Graph & Twitter Social Sharing Meta Tags -->
    <meta property="og:title" content="Contacts - Seth Dhirja Mal Pariwar Narwana!">
    <meta property="og:description" content="Contact directory for Seth Dhirja Mal Pariwar Narwana family members. Search by name or phone number.">
    <meta property="og:image" content="contactspics/contactsbg.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="icons/house.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
        integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <!--custom CSS-->
    <link href="style.css" rel="stylesheet">
    <!--Google Font 1-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Kaushan+Script" rel="stylesheet">
    <!--Animation CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">
    <!--Wow js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>

    <title>Contacts - Seth Dhirja Mal Pariwar Narwana!</title>
</head>

<body>

    <!-- Central Header Component -->
    <div id="header-component" data-root=""></div>

    <!--contacts section-->

    <div class="container-fluid contacts-section ">

        <div class="container">
            <div class="row text-center">
                <div class="col-md-6">
                    <h1 style="font-size: 3rem;">Contacts</h1>
                    <img loading="lazy" decoding="async" class=" wow rubberBand" src="indexpics/divider.png" width="80%"
                        alt="Seth Dhirja Mal Contacts List">
                </div>
                <div class="col-md-6 wow tada" style="padding-top: 1.5rem;">
                    <input type="text" class="searchbar" id="searchInput" onkeyup="searchFunction()"
                        placeholder="Search for names or numbers..." aria-label="Search contacts by name or phone number">
                    <div id="contactCount" class="text-center text-warning font-weight-bold mb-2">Showing all 150 family contacts</div>

                    <div class="alert alert-warning alert-dismissible fade show" role="alert">
                        <strong>Hello Member!</strong> Make your presence in the directory.
                        <br>
                        <a href="contactus.html">Send us your details.</a>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                </div>
            </div>

            <table class="table contacts-table" id="contactstable">
                <tr style="background-color: #343a40; color: goldenrod;font-size: 1.5rem;">
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Phone No.</th>
                </tr>
            </table>
        </div>

    </div>

    <!-- Central Footer Component -->
    <div id="footer-component" data-root=""></div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"
        integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T"
        crossorigin="anonymous"></script>
    <script src="javascripts/components.js"></script>
    <script src="javascripts/contactstable.js"></script>
    <script>new WOW().init();</script>
</body>

</html>
